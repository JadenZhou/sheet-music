name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  LILYPOND_VERSION: 2.26.0

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  scores:
    name: Scores (rules + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check scores against project rules
        run: uv run sheetmusic lint

      - name: Install LilyPond ${{ env.LILYPOND_VERSION }}
        run: |
          url="https://gitlab.com/api/v4/projects/lilypond%2Flilypond/packages/generic/lilypond/$LILYPOND_VERSION/lilypond-$LILYPOND_VERSION-linux-x86_64.tar.gz"
          curl -sSfL "$url" | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lilypond-$LILYPOND_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build every score
        run: bin/score --share

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: scores-pdf
          path: out/*.pdf
          if-no-files-found: error
