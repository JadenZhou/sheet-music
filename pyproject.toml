[project]
name = "sheetmusic"
version = "0.1.0"
description = "Tools for the sheet-music project: score checks, and later difficulty analysis and fingering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sheetmusic = "sheetmusic.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
